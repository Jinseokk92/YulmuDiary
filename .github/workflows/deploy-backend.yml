name: 백엔드 배포

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast3
  SERVICE_NAME: backend-api
  REGISTRY: asia-northeast3-docker.pkg.dev/project-e40f8456-38b6-457a-97a/docker-repo

jobs:
  deploy:
    name: 백엔드 배포
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle 빌드
        working-directory: backend
        run: bash ./gradlew clean bootJar --no-daemon

      - name: GCP 인증
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: gcloud 설정
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Artifact Registry 인증
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Docker 이미지 빌드
        working-directory: backend
        run: docker build -t ${{ env.SERVICE_NAME }}:latest .

      - name: Docker 이미지 푸시
        run: |
          docker tag ${{ env.SERVICE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:latest

      - name: Cloud Run 배포
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:latest \
            --region ${{ env.REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --quiet

